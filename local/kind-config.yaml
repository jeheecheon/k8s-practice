# kind-config.yaml
# 1개의 Control-Plane(마스터 노드)과 2개의 Worker 노드로 구성된 클러스터 설정
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # 1. 마스터 노드 (Control Plane)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Ingress(HTTP 80, HTTPS 443) 트래픽을 호스트 머신(Mac)에서 바로 접근할 수 있도록 포트 매핑
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # 2. 워커 노드 1 (Worker)
  - role: worker

  # 3. 워커 노드 2 (Worker)
  - role: worker
